name: Super-Linter

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      repair_script_modes:
        description: Repair manifest-defined modes only after successful lint
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: modes-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

env:
  SCRIPT_MODE_CODE: |
    import os
    from pathlib import PurePosixPath
    import subprocess
    import sys

    repair = os.environ.get("REPAIR_SCRIPT_MODES") == "1"
    raw = subprocess.check_output(["git", "ls-files", "--stage", "-z"])
    entries = {}
    for entry in raw.split(b"\0"):
        if not entry:
            continue
        metadata, raw_path = entry.split(b"\t", 1)
        mode, oid, stage = metadata.split()
        if stage != b"0":
            raise SystemExit("Unmerged index; refusing permission changes")
        entries[os.fsdecode(raw_path)] = (mode, oid)
    manifest = ".github/executable-files.txt"
    if manifest not in entries or entries[manifest][0] not in (b"100644", b"100755"):
        raise SystemExit("Executable manifest must be a tracked regular file")
    text = subprocess.check_output(["git", "show", ":" + manifest]).decode("utf-8")
    allowed = set()
    for line in text.splitlines():
        if not line.strip() or line.lstrip().startswith("#"):
            continue
        path = PurePosixPath(line)
        if line != line.strip() or path.is_absolute() or path.as_posix() != line or ".." in path.parts or any(char in line for char in "*?[]\\"):
            raise SystemExit("Manifest requires exact repository-relative paths")
        if line in allowed:
            raise SystemExit("Duplicate executable manifest entry")
        allowed.add(line)
    if not allowed:
        raise SystemExit("Executable manifest must not be empty")
    for path in allowed:
        if path not in entries or entries[path][0] not in (b"100644", b"100755"):
            raise SystemExit("Manifest entry must be a tracked regular file: " + path)
        blob = subprocess.check_output(["git", "cat-file", "blob", entries[path][1].decode()])
        if not blob.startswith(b"#!"):
            raise SystemExit("Executable entry point needs a shebang: " + path)
    changes = []
    for path, (mode, _) in entries.items():
        if mode not in (b"100644", b"100755"):
            continue
        wanted = b"100755" if path in allowed else b"100644"
        if mode != wanted:
            if os.path.islink(path) or not os.path.isfile(path):
                raise SystemExit("Working tree file is not regular: " + path)
            changes.append((path, wanted))
    for path, wanted in changes:
        if repair:
            bits = os.stat(path).st_mode & ~0o111
            os.chmod(path, bits | (0o111 if wanted == b"100755" else 0))
            flag = "--chmod=+x" if wanted == b"100755" else "--chmod=-x"
            subprocess.run(["git", "update-index", flag, "--", path], check=True)
        print(("Fixed " if repair else "Expected ") + wanted.decode() + ": " + repr(path))
    print(f"Executable manifest audit: {len(changes)} " + ("fixed" if repair else "incorrect"))
    sys.exit(0 if repair or not changes else 1)

jobs:
  lint:
    name: Lint repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
    steps:
      - name: Check out the exact submitted commit without changing permissions
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the immutable lint snapshot
        id: snapshot
        shell: bash
        env:
          EXPECTED_LINT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse --verify HEAD)"
          git cat-file -e "${actual}^{commit}"
          test "$actual" = "$EXPECTED_LINT_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          printf 'Verified lint snapshot: %s; workflow event SHA: %s\n' "$actual" "$GITHUB_SHA"
          printf 'sha=%s\n' "$actual" >> "$GITHUB_OUTPUT"
      - name: Run explicit Bash lint and capture readable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bash-lint"
          git ls-files -z -- '*.sh' > "$RUNNER_TEMP/bash-lint/files"
          mapfile -d '' -t scripts < "$RUNNER_TEMP/bash-lint/files"
          if ((${#scripts[@]})); then
            docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace \
              --entrypoint shellcheck ghcr.io/super-linter/super-linter:v9.0.0 \
              --format=gcc --external-sources --source-path=SCRIPTDIR -- "${scripts[@]}" \
              2>&1 | tee "$RUNNER_TEMP/bash-lint/shellcheck.log"
          else
            printf 'No tracked Bash scripts found.\n' | tee "$RUNNER_TEMP/bash-lint/shellcheck.log"
          fi
      - name: Run Super-Linter with repository-owned rules
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        uses: super-linter/super-linter@v9.0.0
        env:
          # v9 derives its lint SHA from the actual checkout, not a PR merge ref.
          RUN_LOCAL: true
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          ENABLE_GITHUB_ACTIONS_GROUP_TITLE: true
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          SAVE_SUPER_LINTER_SUMMARY: true
          MULTI_STATUS: false
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          LINTER_RULES_PATH: .github/linters
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          # Inclusion-only selection; executable modes are managed after lint.
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_JAVASCRIPT_ES: true
          MARKDOWN_CONFIG_FILE: .markdown-lint.yml
          VALIDATE_MARKDOWN: true
          PYTHON_RUFF_CONFIG_FILE: .ruff.toml
          PYTHON_RUFF_FORMAT_CONFIG_FILE: .ruff.toml
          VALIDATE_PYTHON_RUFF: true
          VALIDATE_YAML: true
          YAML_CONFIG_FILE: .yaml-lint.yml
      - name: Preserve Bash diagnostics even when lint fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bash-lint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bash-lint
          if-no-files-found: ignore
          retention-days: 7

  repair-script-modes:
    name: Repair executable script modes after successful lint
    needs: lint
    if: ${{ needs.lint.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out only the exact commit that passed lint
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.lint.outputs.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Configure Python for post-lint regression tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test explicit executable intent and fail-closed validation
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          code = os.environ["SCRIPT_MODE_CODE"]
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              def git(*args):
                  return subprocess.check_output(["git", *args], cwd=root)
              git("init", "-q")
              examples = {
                  "run.sh": "#!/bin/sh\nexit 0\n",
                  "run.py": "#!/usr/bin/env python3\npass\n",
                  "run.mjs": "#!/usr/bin/env node\n",
                  "unlisted.sh": "#!/bin/sh\nexit 0\n",
                  "test_module.py": "import unittest\n",
                  "library.py": "VALUE = 1\n",
                  "config.mjs": "export default [];\n",
                  "sourced.sh": "value=1\n",
              }
              for name, text in examples.items():
                  (root / name).write_text(text)
                  (root / name).chmod(0o755 if name in ("unlisted.sh", "test_module.py") else 0o644)
              (root / "linked-script").symlink_to("run.sh")
              (root / ".github").mkdir()
              manifest = root / ".github/executable-files.txt"
              good = "run.sh\nrun.py\nrun.mjs\n"
              manifest.write_text(good)
              git("add", ".")
              content = git("diff", "--cached", "--numstat")
              env = dict(os.environ, REPAIR_SCRIPT_MODES="1")
              subprocess.run(["python3", "-c", code], cwd=root, env=env, check=True)
              modes = {line.split(b"\t", 1)[1].decode(): line.split()[0] for line in git("ls-files", "--stage").splitlines()}
              for name in ("run.sh", "run.py", "run.mjs"):
                  assert modes[name] == b"100755"
              for name in ("unlisted.sh", "test_module.py", "library.py", "config.mjs", "sourced.sh"):
                  assert modes[name] == b"100644"
              assert modes["linked-script"] == b"120000"
              assert git("diff", "--cached", "--numstat") == content
              result = subprocess.check_output(["python3", "-c", code], cwd=root, env=env)
              assert b"0 fixed" in result
              for invalid in ("run.sh\nrun.sh\n", "missing.sh\n", "linked-script\n", "library.py\n", "../run.sh\n", "*.sh\n", ""):
                  manifest.write_text(invalid)
                  git("add", ".github/executable-files.txt")
                  before = git("ls-files", "--stage")
                  failed = subprocess.run(["python3", "-c", code], cwd=root, env=env, capture_output=True)
                  assert failed.returncode != 0
                  assert git("ls-files", "--stage") == before
              manifest.write_text(good)
              git("add", ".github/executable-files.txt")
              subprocess.run(["python3", "-c", code], cwd=root, env=dict(os.environ, REPAIR_SCRIPT_MODES="0"), check=True)
          PY
      - name: Apply manifest modes only to the commit that passed lint
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          LINTED_SHA: ${{ needs.lint.outputs.sha }}
          ENABLE_REPAIR: ${{ github.event_name != 'workflow_dispatch' || inputs.repair_script_modes }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$LINTED_SHA"
          test -z "$(git status --porcelain)"
          git fetch origin "refs/heads/$TARGET_BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$LINTED_SHA" ]]; then
            printf 'Branch changed after lint; refusing to repair unvalidated content.\n' >&2
            exit 1
          fi
          if [[ "$ENABLE_REPAIR" == true ]]; then
            REPAIR_SCRIPT_MODES=1 python3 -c "$SCRIPT_MODE_CODE"
          fi
          REPAIR_SCRIPT_MODES=0 python3 -c "$SCRIPT_MODE_CODE"
      - name: Run all regression tests after content lint and mode validation
        run: python3 -m unittest discover -s helpers -p 'test_*.py'
      - name: Publish mode-only changes after successful lint and tests
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
          LINTED_SHA: ${{ needs.lint.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          if git diff --cached --quiet; then
            printf 'Manifest modes already correct; no repair commit required.\n'
            exit 0
          fi
          git diff --cached --numstat | awk '
            $1 != 0 || $2 != 0 { bad = 1 }
            END { exit bad }
          '
          git fetch origin "refs/heads/$TARGET_BRANCH"
          if [[ "$(git rev-parse FETCH_HEAD)" != "$LINTED_SHA" ]]; then
            printf 'Branch moved during validation; refusing to overwrite concurrent work.\n' >&2
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Apply reviewed executable-file manifest modes after successful lint'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          REPAIR_SCRIPT_MODES=0 python3 -c "$SCRIPT_MODE_CODE"
          git ls-tree -r HEAD
          gh workflow run super-linter.yml --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" -f repair_script_modes=false

  script-modes:
    name: Audit fork permissions and tests after successful lint
    needs: lint
    if: ${{ needs.lint.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the linted fork snapshot without write credentials
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ needs.lint.outputs.sha }}
          persist-credentials: false
      - name: Configure Python for read-only regression tests
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit manifest modes without repairing the fork
        run: REPAIR_SCRIPT_MODES=0 python3 -c "$SCRIPT_MODE_CODE"
      - name: Run regression tests without changing fork permissions
        run: python3 -m unittest discover -s helpers -p 'test_*.py'
